server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${MULENET_OIDC_BROWSER_ORIGIN}; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 70s;
        proxy_connect_timeout 3s;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location ~ /\. {
        return 404;
    }
}

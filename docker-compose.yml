name: mulenet
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      MULENET_DB_PASSWORD: ${MULENET_DB_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    networks: [backplane]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.7-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?Generate .env first}', --maxmemory, 256mb, --maxmemory-policy, allkeys-lru]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate .env first}
    networks: [backplane]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 30
  kafka:
    image: apache/kafka:4.1.1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Generate .env first}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    networks: [backplane]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    image: mulenet/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
    networks: [backplane]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    image: mulenet/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ['127.0.0.1:8080:8080']
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-platform}
      SPRING_FLYWAY_ENABLED: 'false'
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: mulenet_runtime
      DB_PASS: ${MULENET_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MULENET_ML_URL: http://ml_service:8000
      MULENET_SERVICE_SECRET: ${MULENET_SERVICE_SECRET:?Generate .env first}
      MULENET_STREAM_SECRET: ${MULENET_STREAM_SECRET:?Upgrade installation keys}
      MULENET_INGESTION_SECRET: ${MULENET_INGESTION_SECRET:?Upgrade installation keys}
      MULENET_TOKEN_KEY: ${MULENET_TOKEN_KEY:?Generate .env first}
      MULENET_ENCRYPTION_KEY: ${MULENET_ENCRYPTION_KEY:?Generate .env first}
      MULENET_DEMO_JWT_SECRET: ${MULENET_DEMO_JWT_SECRET}
      MULENET_DEMO_ANALYST_PASSWORD: ${MULENET_DEMO_ANALYST_PASSWORD}
      MULENET_DEMO_SUPERVISOR_PASSWORD: ${MULENET_DEMO_SUPERVISOR_PASSWORD}
      MULENET_DEMO_ADMIN_PASSWORD: ${MULENET_DEMO_ADMIN_PASSWORD}
      MULENET_DEMO_AUDITOR_PASSWORD: ${MULENET_DEMO_AUDITOR_PASSWORD}
      MULENET_OIDC_ISSUER: ${MULENET_OIDC_ISSUER:-}
      MULENET_CORS_ORIGINS: ${MULENET_CORS_ORIGINS:-http://localhost:3000}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backplane, gateway]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
  ml_service:
    image: mulenet/ml:local
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    environment:
      MULENET_SERVICE_SECRET: ${MULENET_SERVICE_SECRET:?Generate .env first}
      MULENET_REGISTRY_DIR: /registry
      MULENET_ALLOW_SYNTHETIC: ${MULENET_ALLOW_SYNTHETIC:-false}
      MULENET_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ./artifacts:/registry:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backplane]
    depends_on:
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3000:80']
    networks: [gateway]
    depends_on: [backend]
networks:
  backplane: {internal: true}
  gateway: {}
volumes:
  postgres_data: {}

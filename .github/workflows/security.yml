name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen --all-groups python scripts/check_unsafe_paths.py
      - run: uv run --frozen --all-groups python scripts/audit_python.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: uv run --frozen --all-groups python scripts/audit_frontend.py
      - name: Full-history secret audit
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" zricethezav/gitleaks:v8.30.1 git /repo --log-opts=--all --redact --report-format json --report-path /reports/gitleaks-history.json
          result=$?
          set -e
          test "$result" -eq 0 -o "$result" -eq 1
          uv run --frozen --all-groups python scripts/triage_secrets.py
      - run: uv run --frozen --all-groups python scripts/record_tests.py --phase security-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-receipts
          path: reports/*.json
          if-no-files-found: error

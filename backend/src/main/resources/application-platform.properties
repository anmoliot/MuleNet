mulenet.token-key=${MULENET_TOKEN_KEY}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
mulenet.encryption-key=${MULENET_ENCRYPTION_KEY}
mulenet.service-secret=${MULENET_SERVICE_SECRET}
mulenet.ml-url=${MULENET_ML_URL:http://ml_service:8000}
mulenet.oidc-issuer=${MULENET_OIDC_ISSUER:}
mulenet.oidc-audience=${MULENET_OIDC_AUDIENCE:mulenet-api}
mulenet.cors-origins=${MULENET_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.kafka.admin.fail-fast=true
server.error.include-message=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=2MB
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true

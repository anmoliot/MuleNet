mulenet.token-key=${MULENET_TOKEN_KEY}
mulenet.encryption-key=${MULENET_ENCRYPTION_KEY}
mulenet.service-secret=${MULENET_SERVICE_SECRET}
mulenet.stream-secret=${MULENET_STREAM_SECRET}
mulenet.ingestion-secret=${MULENET_INGESTION_SECRET}
spring.task.scheduling.pool.size=4
mulenet.ml-url=${MULENET_ML_URL:http://ml_service:8000}
mulenet.oidc-issuer=${MULENET_OIDC_ISSUER:}
mulenet.oidc-audience=${MULENET_OIDC_AUDIENCE:mulenet-api}
mulenet.oidc-jwks-uri=${MULENET_OIDC_JWKS_URI:}
mulenet.allow-insecure-local-oidc=${MULENET_ALLOW_INSECURE_LOCAL_OIDC:false}
mulenet.cors-origins=${MULENET_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.kafka.admin.fail-fast=true
server.error.include-message=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.connection-timeout=5s
server.tomcat.threads.max=64
server.tomcat.max-connections=256
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Generate .env first}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Generate .env first}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports: ['127.0.0.1:8081:8080']
    volumes: ['./KeycloakRealm.json:/opt/keycloak/data/import/realm.json:ro', 'keycloak_data:/opt/keycloak/data']
    networks: [backplane, gateway]
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: platform
      MULENET_OIDC_ISSUER: http://localhost:8081/realms/mulenet
      MULENET_OIDC_JWKS_URI: http://keycloak:8080/realms/mulenet/protocol/openid-connect/certs
      MULENET_ALLOW_INSECURE_LOCAL_OIDC: 'true'
volumes:
  keycloak_data: {}
